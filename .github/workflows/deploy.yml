name: deploy-book

# Only run this when the master branch changes
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install dependencies
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          activate-environment: phys142
          environment-file: environment.yml
          python-version: 3.10.10
          auto-activate-base: false

      # Check dependencies
      - name: Check Miniconda
        shell: bash -l {0}
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          printenv | sort

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: "1.6.1"

      - name: Add IJulia
        run: julia -e 'using Pkg; Pkg.add("IJulia")'

      - name: Build the book
        shell: bash -l {0}
        run: |
          jupyter-book build .

      - name: Compile LaTeX
        uses: docker://xucheng/texlive-full:latest
        with:
          entrypoint: /bin/sh
          args: |
            -c "\
            cd syllabus && \
            latexmk -pdf && \
            cd ../assignments/assignment1 && \
            latexmk -pdf && \
            cd ../assignment2 && \
            latexmk -pdf && \
            cd ../assignment3 && \
            latexmk -pdf && \
            cd ../final_projects && \
            latexmk -pdf"

      - name: Copy syllabus and homework for deployment
        run: |
          cp syllabus/syllabus.pdf _build/html/syllabus.pdf && \
          cp assignments/assignment1/assignment1.pdf _build/html/assignment1.pdf && \
          cp assignments/assignment2/assignment2.pdf _build/html/assignment2.pdf && \
          cp assignments/assignment3/assignment3.pdf _build/html/assignment3.pdf && \
          cp assignments/final_projects/final_projects.pdf _build/html/final_projects.pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: _build/html

      - name: GitHub Pages action
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # Deploys the built site to the department web server (jduarte.physics.ucsd.edu).
      # Additive on purpose: no --delete, so files uploaded by hand (e.g. lecture PDFs,
      # labs/lab1/01_DataHub.pdf) are preserved. Skips silently until secrets are set.
      - name: Deploy to users.physics.ucsd.edu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.PHYSICS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PHYSICS_KNOWN_HOSTS }}
          DEST: ${{ secrets.PHYSICS_DEST }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${DEST:-}" ]; then
            echo "PHYSICS_SSH_KEY / PHYSICS_DEST not set - skipping web server deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          # LC_ALL/LANG=C: the server (CentOS 7) lacks C.UTF-8, which ssh would otherwise forward.
          LC_ALL=C LANG=C rsync -rlvz --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            _build/html/ "$DEST"
