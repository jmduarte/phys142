name: phys142
channels:
    - conda-forge
dependencies:
    - python=3.10.10
    - jupyter_contrib_nbextensions==0.7.0
    # The declared nbextensions require the classic Notebook APIs removed in 7.
    - notebook<7
    - jupyter-book==0.15.1
    - numpy
    - scipy
    - ffmpeg
    - imagemagick
    - scikit-learn
    - matplotlib
    - tqdm
    - numba
    - pip
    - pip:
      - requests
      - ipywidgets
      - widgetsnbextension
      - sphinxcontrib-mermaid==2.0.2
