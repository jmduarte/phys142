name: Test DataHub RISE setup

on:
  pull_request:
    paths:
      - 'ci/datahub/**'
      - '.github/workflows/test-datahub-rise.yml'
  push:
    branches: [main]
    paths:
      - 'ci/datahub/**'
      - '.github/workflows/test-datahub-rise.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ci/datahub/requirements-test.txt
      - run: python -m unittest discover -s ci/datahub -p 'test_*.py' -v
